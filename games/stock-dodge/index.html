<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#f5f7ff;background:#101629}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:900px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between}header strong{font-size:22px}header span,.muted{color:#b5c1d8}.hero{background:#1b2640;border:1px solid #354564;border-radius:22px;padding:24px;text-align:center}h1{font-size:clamp(26px,5vw,42px);margin:4px 0 8px}.tag{color:#facc15;font-weight:800}.game{max-width:460px;margin:20px auto 0}.hud{display:flex;justify-content:space-between;margin:0 0 10px;font-weight:800}.stage{position:relative;overflow:hidden;background:linear-gradient(#293859,#17213b);border:2px solid #5a7096;border-radius:16px;aspect-ratio:3/4;touch-action:none}.stage canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#10192bdc;padding:20px;gap:12px}.overlay[hidden]{display:none}.overlay h2{margin:0;font-size:28px}.overlay p{margin:0;line-height:1.7}button{border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:800;cursor:pointer;background:#facc15;color:#182033}.controls{display:flex;gap:12px;justify-content:space-between;margin-top:12px}.controls button{width:48%;font-size:24px;touch-action:none;user-select:none}footer{text-align:center;color:#aebbd0;font-size:13px}

.overlay{padding:10px;gap:8px;overflow:auto}.overlay h2{font-size:clamp(17px,4vw,25px)}.overlay p{font-size:14px;line-height:1.4}.overlay button{min-height:44px;padding:10px 16px;font-size:16px}

/* Prevent iOS long-press selection across the game, including nearby labels. */
.hero,.hero *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.controls button{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:none;display:flex;align-items:center;justify-content:center}

.hit-toast.pop{animation:hit-pop .24s ease-out}@keyframes hit-pop{from{transform:scale(.7) rotate(-5deg)}to{transform:scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){.hit-toast.pop{animation:none}}

.result-card{width:100%;max-width:300px;text-align:center;background:#202f4b;border:1px solid #526786;border-radius:14px;padding:12px}
.result-card[hidden],.share-actions[hidden],.share-fallback[hidden]{display:none}
.result-score{font-size:32px;font-weight:900;color:#facc15}.result-stats{font-size:14px;line-height:1.7;color:#d4def1}
.share-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}.share-actions button{background:#d7ecff;color:#17213b;font-size:14px}

.share-fallback{width:100%}.share-fallback textarea{-webkit-touch-callout:default;width:100%;min-height:86px;font-size:16px;-webkit-user-select:text;user-select:text}
.overlay.results>*{flex-shrink:0}.overlay.results{justify-content:flex-start;padding:16px 10px}.overlay.results h2{font-size:22px}.overlay.results #resultText{text-align:center}
@media(max-height:520px){.overlay.results{padding:8px}.result-card{padding:6px}.result-score{font-size:22px}.result-stats{line-height:1.4}.overlay.results h2{font-size:18px}}

.social-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-bottom:8px}
.social-links a,.social-links button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:800;text-decoration:none;color:white;background:#354864;touch-action:manipulation}
.social-links #shareFacebook{background:#165dc6}.social-links #shareThreads,.social-links #shareX{background:#0b1220}
.social-links #shareInstagram{background:#9c2864}.social-links #shareYoutube{background:#ad2534}
.share-panel{width:100%;max-width:320px}.share-panel[hidden]{display:none}.share-panel summary{cursor:pointer;padding:12px;border-radius:10px;background:#2b405f;font-size:15px;font-weight:800;min-height:44px}
.share-panel[open] summary{margin-bottom:8px}
.share-guide{margin:8px 0!important;font-size:14px!important;text-align:left;line-height:1.6!important;color:#d7e6ff}

<main><section class="hero"><div class="tag">本週遊戲</div><h1>閃躲股票！</h1><p class="muted">股票泡泡從天而降，左右閃躲，撐過60秒！</p><div class="game"><div class="hud"><span id="time">剩餘 60 秒</span><span id="hits">碰撞 0 / 3</span></div><div class="arena"><div class="stage" id="stage"><canvas id="canvas" width="360" height="480" aria-label="閃躲股票泡泡遊戲"></canvas><div class="hit-toast" id="hitToast" role="status" aria-live="polite" hidden><small id="hitStock"></small><span id="hitJoke"></span></div><div class="overlay" id="overlay"><h2 id="resultTitle">準備好閃躲了嗎？</h2><p id="resultText">方向鍵 ← → 或下方按鈕移動<br>60秒不被撞倒就過關！</p><div id="resultCard" class="result-card" hidden><div id="resultScore" class="result-score"></div><div id="resultStats" class="result-stats"></div></div><div id="shareActions" class="share-actions" hidden><button id="shareResult" type="button">手機分享</button><button id="copyResult" type="button">複製戰績</button></div><details id="socialPanel" class="share-panel" hidden><summary>分享到 FB、Threads、X、IG、YouTube</summary><div class="social-links"><a id="shareFacebook" target="_blank" rel="noopener noreferrer">Facebook</a><a id="shareThreads" target="_blank" rel="noopener noreferrer">Threads</a><a id="shareX" target="_blank" rel="noopener noreferrer">X</a><button id="shareInstagram" type="button">IG 分享教學</button><button id="shareYoutube" type="button">YouTube 教學</button><button id="copyGameLink" type="button">複製連結</button></div><p class="share-guide" id="socialGuide">FB 分享遊戲連結；要附成績，請先按「複製戰績」再貼上。Threads／X 會帶入戰績。朋友點連結就能開啟遊戲。</p></details><p id="shareStatus" role="status" aria-live="polite"></p><div id="shareFallback" class="share-fallback" hidden><label for="shareText">長按下方文字即可複製</label><textarea id="shareText" readonly></textarea></div><button id="start">開始遊戲</button></div></div></div><div class="controls"><button id="left" aria-label="向左移動"></button><button id="right" aria-label="向右移動"></button></div></div></section></main>

<script>
(()=>{
'use strict';
const arena=document.querySelector('.arena'),stage=document.getElementById('stage');
function fitStage(){
 const width=arena.clientWidth,height=arena.clientHeight;
 const h=Math.max(0,Math.min(height,(width-4)*4/3+4));
 stage.style.setProperty('--stage-height',`${h}px`);
 stage.style.setProperty('--stage-width',`${Math.max(0,(h-4)*3/4+4)}px`);
}
function fitViewport(){
 // Do not resize the game in response to accessibility pinch zoom.
 if(window.visualViewport && window.visualViewport.scale!==1)return;
 document.documentElement.style.setProperty('--viewport-height',`${window.visualViewport?.height||window.innerHeight}px`);
 fitStage();
}
new ResizeObserver(fitStage).observe(arena);
window.addEventListener('resize',fitViewport);
window.visualViewport?.addEventListener('resize',fitViewport);
fitViewport();

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),title=document.getElementById('resultTitle'),description=document.getElementById('resultText'),timeLabel=document.getElementById('time'),hitLabel=document.getElementById('hits');
const W=360,H=480,DURATION=60,player={x:160,y:423,w:40,h:40};
const STOCKS=[
 {name:'台積電',joke:'台積電，我積怨！',color:'#f57f9e'},
 {name:'聯發科',joke:'聯發科，連發哭！',color:'#b599ff'},
 {name:'台達電',joke:'台達電，電到我！',color:'#70cfff'},
 {name:'友達',joke:'人生阿達！',color:'#82e2b5'},
 {name:'群創',joke:'群創，讓我群創傷！',color:'#72dce5'},
 {name:'國巨',joke:'國巨，我的悲劇！',color:'#ffc36c'},
 {name:'金居',joke:'金居，套房定居！',color:'#f5dc77'},
 {name:'旺宏',joke:'旺宏，我的眼眶紅！',color:'#ff9393'},
 {name:'聯合再生',joke:'聯合再生，錢包往生！',color:'#b5df7b'}
];
const toast=document.getElementById('hitToast'),hitStock=document.getElementById('hitStock'),hitJoke=document.getElementById('hitJoke');
const GAME_URL='https://news-arcade.pages.dev/games/stock-dodge/';
const socialPanel=document.getElementById('socialPanel'),socialGuide=document.getElementById('socialGuide');
const DEFAULT_SOCIAL_GUIDE='FB 分享遊戲連結；要附成績，請先按「複製戰績」再貼上。Threads／X 會帶入戰績。朋友點連結就能開啟遊戲。';
let toastTimer=0,lastJoke='',lastStock='',dodged=0,hitCounts={},currentResult=null,personalBest=0,shareBusy=false;
try{personalBest=Number(localStorage.getItem('stock-dodge-best-v1'))||0;}catch{}
const resultCard=document.getElementById('resultCard'),resultScore=document.getElementById('resultScore'),resultStats=document.getElementById('resultStats'),shareActions=document.getElementById('shareActions'),shareStatus=document.getElementById('shareStatus'),shareFallback=document.getElementById('shareFallback'),shareText=document.getElementById('shareText');
function showHit(stock){
 lastStock=stock.name;hitCounts[stock.name]=(hitCounts[stock.name]||0)+1;lastJoke=stock.joke;hitStock.textContent='撞到 '+stock.name;hitJoke.textContent=stock.joke;
 clearTimeout(toastTimer);toast.hidden=false;toast.classList.remove('pop');void toast.offsetWidth;toast.classList.add('pop');
 toastTimer=setTimeout(()=>{toast.hidden=true;},1600);
}
let running=false,remaining=DURATION,hits=0,blocks=[],keys={left:false,right:false},last=0,spawn=0,invincible=0,cryTimer=0,raf=0;
function reset(){socialPanel.hidden=true;socialPanel.open=false;socialGuide.textContent=DEFAULT_SOCIAL_GUIDE;dodged=0;hitCounts={};lastStock='';currentResult=null;resultCard.hidden=true;shareActions.hidden=true;shareFallback.hidden=true;shareStatus.textContent='';overlay.classList.remove('results');clearTimeout(toastTimer);toast.hidden=true;lastJoke='';keys.left=keys.right=false;remaining=DURATION;hits=0;blocks=[];spawn=0;invincible=0;cryTimer=0;player.x=160;last=0;timeLabel.textContent='剩餘 60 秒';hitLabel.textContent='碰撞 0 / 3';}
function makeResult(win,remaining,hits,dodged){
 const seconds=Math.min(DURATION,Math.max(0,DURATION-remaining));
 const score=Math.floor(seconds*10)+dodged*20+(win?300+(3-hits)*100:0);
 const rank=win?(hits===0?'空手股神':hits===1?'閃躲巴菲特':'套牢逃生王'):seconds>=40?'收盤前破功':seconds>=20?'資深接刀俠':'韭菜界閃電俠';
 const joke=win?(hits===0?'一股都沒買，一滴淚沒流。':hits===1?'只受一點傷，還能假裝是股神。':'兩次套牢都逃掉，這次真的學乖了！'):seconds>=40?'差一點就退休，結果先退場。':seconds>=20?'別人逢低買進，你逢低被擊中。':'進場比誰都快，畢業也是。';
 return {win,seconds,score,rank,joke,hits,dodged};
}
function finish(win){
 running=false;keys.left=keys.right=false;cancelAnimationFrame(raf);clearTimeout(toastTimer);toast.hidden=true;
 currentResult=makeResult(win,remaining,hits,dodged);
 const previousBest=personalBest;personalBest=Math.max(personalBest,currentResult.score);
 try{localStorage.setItem('stock-dodge-best-v1',String(personalBest));}catch{}
 title.textContent=(win?'🏆 ':'🥬 ')+currentResult.rank;
 description.textContent=currentResult.joke;
 resultScore.textContent=currentResult.score+' 分';
 const nemesis=Object.entries(hitCounts).sort((a,b)=>b[1]-a[1])[0];
 resultStats.replaceChildren();
 const stats=[
  '存活 '+currentResult.seconds.toFixed(1)+' 秒 · 閃過 '+dodged+' 顆',
  '碰撞 '+hits+' / 3'+(nemesis?' · 冤家：'+nemesis[0]:' · 完美零碰撞'),
  (currentResult.score>previousBest?'✨ 個人新紀錄！':'個人最佳：')+personalBest+' 分',
  '計分：每秒10分＋閃過20分',
  '過關加300分，每剩一次容錯加100分'
 ];
 for(const text of stats){const row=document.createElement('div');row.textContent=text;resultStats.append(row);}
 if(!win&&lastJoke){const row=document.createElement('div');row.textContent='最後一擊：'+lastJoke;resultStats.append(row);}
 configureSocialLinks(currentResult);socialPanel.hidden=false;resultCard.hidden=false;shareActions.hidden=false;shareStatus.textContent='';shareFallback.hidden=true;
 start.textContent='再挑戰一次';overlay.classList.add('results');overlay.hidden=false;draw();
}
function resultShareText(result){
 return '【閃躲股票】我是「'+result.rank+'」！\n'+result.score+' 分｜存活 '+result.seconds.toFixed(1)+' 秒｜閃過 '+result.dodged+' 顆｜碰撞 '+result.hits+'/3\n'+result.joke+'\n你能比我更會閃嗎？\nhttps://news-arcade.pages.dev/games/stock-dodge/';
}
async function copyScore(text){
 try{
  if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
  await navigator.clipboard.writeText(text);shareStatus.textContent='已複製！貼到 LINE 或社群挑戰朋友。';shareFallback.hidden=true;
 }catch{
  shareFallback.hidden=false;shareText.value=text;shareText.focus();shareText.select();shareStatus.textContent='請長按或選取文字複製。';
 }
}
async function shareScore(copyOnly=false){
 if(!currentResult||shareBusy)return;
 const result=currentResult,text=resultShareText(result);shareBusy=true;
 try{
  if(!copyOnly&&navigator.share){
   try{await navigator.share({title:'閃躲股票｜'+result.rank,text});if(currentResult===result)shareStatus.textContent='已開啟分享。';}
   catch(error){if(error.name==='AbortError'){if(currentResult===result)shareStatus.textContent='已取消分享，成績仍保留。';}else if(currentResult===result)await copyScore(text);}
  }else await copyScore(text);
 }finally{shareBusy=false;}
}
document.getElementById('shareResult').addEventListener('click',()=>shareScore());
document.getElementById('copyResult').addEventListener('click',()=>shareScore(true));

function socialShareLinks(result){
 const text=resultShareText(result);
 return {
  facebook:'https://www.facebook.com/sharer/sharer.php?'+new URLSearchParams({u:GAME_URL}),
  threads:'https://www.threads.com/intent/post?'+new URLSearchParams({text}),
  x:'https://x.com/intent/tweet?'+new URLSearchParams({text:'【閃躲股票】'+result.rank+'！'+result.score+'分，閃過'+result.dodged+'顆。你能比我更會閃嗎？',url:GAME_URL})
 };
}
function configureSocialLinks(result){
 const urls=socialShareLinks(result);
 document.getElementById('shareFacebook').href=urls.facebook;
 document.getElementById('shareThreads').href=urls.threads;
 document.getElementById('shareX').href=urls.x;
}
function showPlatformHelp(platform){
 if(!currentResult)return;
 socialGuide.textContent=platform==='instagram'
  ?'Instagram：先截圖結算畫面，在 IG 建立貼文或限時動態。按「複製戰績」取得文案；限動可用「連結」貼圖貼上「複製連結」取得的遊戲網址。此按鈕不會自動發文。'
  :'YouTube：先錄製遊戲影片，再自行上傳。按「複製戰績」取得文案，遊戲連結可放頻道個人檔案或已啟用進階功能的長影片說明。Shorts 說明／留言的外部網址無法直接點擊。';
 socialGuide.scrollIntoView({block:'nearest'});
}
document.getElementById('shareInstagram').addEventListener('click',()=>showPlatformHelp('instagram'));
document.getElementById('shareYoutube').addEventListener('click',()=>showPlatformHelp('youtube'));
document.getElementById('copyGameLink').addEventListener('click',()=>copyScore(GAME_URL));

function play(){cancelAnimationFrame(raf);reset();running=true;overlay.hidden=true;raf=requestAnimationFrame(loop);}
function spawnBlock(){const size=64+Math.random()*8;const stock=STOCKS[Math.floor(Math.random()*STOCKS.length)];blocks.push({x:Math.random()*(W-size),y:-size,w:size,h:size,speed:125+Math.random()*100,stock});}
function collide(a,b){const r=b.w/2,cx=b.x+r,cy=b.y+r;const x=Math.max(a.x,Math.min(cx,a.x+a.w)),y=Math.max(a.y,Math.min(cy,a.y+a.h));return (cx-x)**2+(cy-y)**2<r*r;}
function update(dt){remaining=Math.max(0,remaining-dt);timeLabel.textContent=`剩餘 ${Math.ceil(remaining)} 秒`;if(remaining<=0){finish(true);return;}
const move=(Number(keys.right)-Number(keys.left))*235*dt;player.x=Math.max(0,Math.min(W-player.w,player.x+move));spawn+=dt;while(spawn>=0.52){spawn-=0.52;spawnBlock();}
cryTimer=Math.max(0,cryTimer-dt);invincible=Math.max(0,invincible-dt);for(const b of blocks){b.y+=b.speed*dt;if(invincible===0&&collide(player,b)){hits++;b.hit=true;showHit(b.stock);invincible=1.1;cryTimer=1.6;hitLabel.textContent=`碰撞 ${hits} / 3`;b.y=H+100;if(hits>=3){finish(false);return;}}}blocks=blocks.filter(b=>{if(b.y>=H+10){if(!b.hit)dodged++;return false;}return true;});}
function avatarMood(){return cryTimer>0?'cry':keys.left&&!keys.right?'left':keys.right&&!keys.left?'right':'idle';}
function drawOfficeAvatar(){
 const mood=avatarMood(),cry=mood==='cry',dir=mood==='left'?-1:mood==='right'?1:0;
 ctx.save();ctx.translate(player.x+20,player.y+20);ctx.rotate(dir*.12);
 // Head, hair and suit are drawn as vectors so the face stays crisp when resized.
 function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
 function line(points,color,width=1.6){ctx.beginPath();ctx.moveTo(...points[0]);for(const p of points.slice(1))ctx.lineTo(...p);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
 // Office collar and tie beneath the face.
 ellipse(0,22,22,9,'#253a58');
 ctx.fillStyle='#f6f8ff';ctx.beginPath();ctx.moveTo(-10,17);ctx.lineTo(0,29);ctx.lineTo(10,17);ctx.closePath();ctx.fill();
 ctx.fillStyle='#d55868';ctx.beginPath();ctx.moveTo(0,19);ctx.lineTo(-3,23);ctx.lineTo(0,29);ctx.lineTo(3,23);ctx.closePath();ctx.fill();
 ellipse(-20,1,4,6,'#eab38b');ellipse(20,1,4,6,'#eab38b');
 ellipse(0,0,21,24,'#f4c69e');ctx.strokeStyle='#563c38';ctx.lineWidth=1.8;ctx.stroke();
 // Receding hairline, gray temples and forehead creases.
 ctx.fillStyle='#33343f';ctx.beginPath();ctx.moveTo(-21,0);ctx.bezierCurveTo(-26,-27,22,-34,21,-1);ctx.lineTo(17,-6);ctx.lineTo(14,-16);ctx.bezierCurveTo(5,-21,-6,-19,-14,-14);ctx.lineTo(-17,-3);ctx.closePath();ctx.fill();
 line([[-19,-10],[-18,-3]],'#b5bac7',2.5);line([[19,-10],[18,-3]],'#b5bac7',2.5);
 line([[-6,-13],[5,-14]],'#c08f74',.8);line([[-5,-10],[4,-11]],'#c08f74',.8);
 // Brows: startled left glance, determined right glance, or distressed crying.
 if(cry){line([[-14,-5],[-7,-9]],'#533b36',2);line([[7,-9],[14,-5]],'#533b36',2);}
 else if(dir<0){line([[-14,-9],[-5,-8]],'#533b36',2);line([[5,-5],[14,-8]],'#533b36',2);}
 else if(dir>0){line([[-14,-7],[-5,-4]],'#533b36',2);line([[5,-4],[14,-8]],'#533b36',2);}
 else{line([[-14,-6],[-5,-6]],'#533b36',1.8);line([[5,-6],[14,-6]],'#533b36',1.8);}
 ellipse(-9,1,7.5,6,'#fffcf1');ellipse(9,1,7.5,6,'#fffcf1');
 if(cry){line([[-13,2],[-9,-1],[-5,2]],'#342e39',2);line([[5,2],[9,-1],[13,2]],'#342e39',2);}
 else{ellipse(-9+dir*2.8,1,2.2,3,'#272d40');ellipse(9+dir*2.8,1,2.2,3,'#272d40');}
 // Rounded glasses and bridge.
 for(const x of [-9,9]){ctx.beginPath();ctx.ellipse(x,1,7.8,6.2,0,0,Math.PI*2);ctx.strokeStyle='#37445c';ctx.lineWidth=1.6;ctx.stroke();}
 line([[-1,0],[1,0]],'#37445c');line([[-20,0],[-17,0]],'#37445c');line([[17,0],[20,0]],'#37445c');
 line([[0,3],[-1,8],[2,8]],'#bc856a',1.2);
 if(cry){
  // Two bright tear streams, visible throughout the hit invulnerability period.
  for(const x of [-11,11]){line([[x,7],[x,16]],'#5cc9ff',3.5);ellipse(x,17+Math.sin(cryTimer*12)*1.5,2.6,3.6,'#92e5ff');}
  ellipse(0,15,5,4,'#623142');ellipse(0,17,3,1.3,'#ed8691');
 }else if(dir<0){ellipse(0,15,3,3.5,'#623142');ellipse(17,-13,2,3.5,'#8ae0ff');}
 else if(dir>0){line([[-5,15],[2,13],[6,14]],'#6b3c3d',1.8);}
 else{line([[-5,14],[0,15],[5,14]],'#6b3c3d',1.5);line([[-11,11],[-13,14]],'#c08f74',.8);line([[11,11],[13,14]],'#c08f74',.8);}
 if(invincible>0){ctx.beginPath();ctx.ellipse(0,0,25,27,0,0,Math.PI*2);ctx.strokeStyle='#ffd376';ctx.lineWidth=2;ctx.stroke();}
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff10';for(let i=0;i<12;i++){ctx.fillRect(i*36,0,1,H)}for(const b of blocks){
 const r=b.w/2,cx=b.x+r,cy=b.y+r;
 ctx.save();
 const gradient=ctx.createRadialGradient(cx-r*.35,cy-r*.45,r*.05,cx,cy,r);
 gradient.addColorStop(0,'#ffffff');gradient.addColorStop(.3,b.stock.color);gradient.addColorStop(1,'#304c78');
 ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle=b.stock.color;ctx.stroke();
 ctx.beginPath();ctx.ellipse(cx-r*.28,cy-r*.48,r*.32,r*.13,-.4,0,Math.PI*2);ctx.fillStyle='#ffffff99';ctx.fill();
 ctx.font='900 '+(b.stock.name.length>3?14:18)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineWidth=3;ctx.strokeStyle='#ffffffcc';ctx.strokeText(b.stock.name,cx,cy+3);ctx.fillStyle='#16233a';ctx.fillText(b.stock.name,cx,cy+3);
 ctx.restore();
 }drawOfficeAvatar();}

function loop(t){if(!running)return;const dt=last?Math.min((t-last)/1000,0.05):0;last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop);}
function bind(id,direction){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[direction]=true;el.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>keys[direction]=false);}
bind('left','left');bind('right','right');
const gameSurface=document.querySelector('.hero');
for(const event of ['selectstart','contextmenu','dragstart']){
 gameSurface.addEventListener(event,e=>{if(e.target!==shareText)e.preventDefault();});
}
// Cancel native long-press behavior without replacing Pointer Events movement.
const controls=document.querySelector('.controls');
for(const event of ['touchstart','touchmove']){
 controls.addEventListener(event,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)keys.left=keys.right=false;});

document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();keys[e.key==='ArrowLeft'?'left':'right']=true;}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys[e.key==='ArrowLeft'?'left':'right']=false;});window.addEventListener('blur',()=>{keys.left=keys.right=false;});start.addEventListener('click',play);draw();
})();
</script>
