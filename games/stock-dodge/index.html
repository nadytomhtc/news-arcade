<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時事遊樂場｜閃躲股票測試版</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#f5f7ff;background:#101629}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:900px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between}header strong{font-size:22px}header span,.muted{color:#b5c1d8}.hero{background:#1b2640;border:1px solid #354564;border-radius:22px;padding:24px;text-align:center}h1{font-size:clamp(26px,5vw,42px);margin:4px 0 8px}.tag{color:#facc15;font-weight:800}.game{max-width:460px;margin:20px auto 0}.hud{display:flex;justify-content:space-between;margin:0 0 10px;font-weight:800}.stage{position:relative;overflow:hidden;background:linear-gradient(#293859,#17213b);border:2px solid #5a7096;border-radius:16px;aspect-ratio:3/4;touch-action:none}.stage canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#10192bdc;padding:20px;gap:12px}.overlay[hidden]{display:none}.overlay h2{margin:0;font-size:28px}.overlay p{margin:0;line-height:1.7}button{border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:800;cursor:pointer;background:#facc15;color:#182033}.controls{display:flex;gap:12px;justify-content:space-between;margin-top:12px}.controls button{width:48%;font-size:24px;touch-action:none;user-select:none}footer{text-align:center;color:#aebbd0;font-size:13px}

/* Size the play area from the visible viewport, including in-app browser bars. */
:root{--viewport-height:100vh}
@supports(height:100dvh){:root{--viewport-height:100dvh}}
body{height:var(--viewport-height);min-height:320px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header,main,footer{width:100%;margin:0 auto;flex-shrink:0}
header{padding:10px 16px;gap:12px}header strong{font-size:18px}header span{font-size:14px}
main{flex:1;min-height:0;padding:0 12px;display:flex}
.hero{width:100%;min-height:0;display:flex;flex-direction:column;padding:12px}
h1{font-size:26px;margin:0}.tag{font-size:14px}.muted{font-size:14px;margin:5px 0;line-height:1.4}
.game{flex:1;min-height:0;width:100%;max-width:460px;margin:8px auto 0;display:flex;flex-direction:column}
.hud{flex-shrink:0;font-size:16px;margin:0 0 6px}
.arena{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{flex-shrink:0;width:var(--stage-width,240px);height:var(--stage-height,320px);aspect-ratio:auto;border-radius:12px}
.controls{flex-shrink:0;margin-top:8px;gap:12px}.controls button{width:50%;height:48px;padding:4px;font-size:24px;-webkit-user-select:none}
footer{font-size:14px;padding:6px 12px}
.overlay{padding:10px;gap:8px;overflow:auto}.overlay h2{font-size:clamp(17px,4vw,25px)}.overlay p{font-size:14px;line-height:1.4}.overlay button{min-height:44px;padding:10px 16px;font-size:16px}
a:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:3px}
@media(max-width:480px){header strong{font-size:16px}header span{font-size:12px}.hero{padding:8px}.tag{display:none}h1{font-size:23px}}
@media(max-height:520px){header{padding:4px 12px}header strong{font-size:16px}.tag,.muted,footer{display:none}h1{font-size:18px}.hero{padding:4px 8px}.game{margin-top:4px;max-width:640px;display:grid;grid-template-columns:minmax(64px,1fr) minmax(0,3fr) minmax(64px,1fr);grid-template-rows:24px minmax(0,1fr);gap:4px 10px}.hud{grid-column:1/-1;margin:0}.arena{grid-column:2;grid-row:2;height:100%}.controls{display:contents}.controls button{width:100%;height:64px;align-self:center;margin:0}#left{grid-column:1;grid-row:2}#right{grid-column:3;grid-row:2}.overlay{gap:5px}.overlay h2{font-size:17px}.overlay p{font-size:14px}}
</style>
</head>
<body>
<header><a href="../../" style="color:inherit;text-decoration:none" aria-label="返回時事遊樂場首頁"><strong>🎮 時事遊樂場</strong></a><span>GAME 001 · 測試版</span></header>
<main><section class="hero"><div class="tag">本週遊戲</div><h1>閃躲股票！</h1><p class="muted">紅色股票從天而降，左右閃躲，撐過60秒！</p><div class="game"><div class="hud"><span id="time">剩餘 60 秒</span><span id="hits">碰撞 0 / 3</span></div><div class="arena"><div class="stage" id="stage"><canvas id="canvas" width="360" height="480" aria-label="閃躲方塊遊戲"></canvas><div class="overlay" id="overlay"><h2 id="resultTitle">準備好閃躲了嗎？</h2><p id="resultText">方向鍵 ← → 或下方按鈕移動<br>60秒不被撞倒就過關！</p><button id="start">開始遊戲</button></div></div></div><div class="controls"><button id="left" aria-label="向左移動">◀</button><button id="right" aria-label="向右移動">▶</button></div></div></section></main>
<footer>時事遊樂場 · <a href="../../" style="color:inherit">返回遊樂場</a> · 免費遊玩</footer>
<script>
(()=>{
'use strict';
const arena=document.querySelector('.arena'),stage=document.getElementById('stage');
function fitStage(){
 const width=arena.clientWidth,height=arena.clientHeight;
 const h=Math.max(0,Math.min(height,(width-4)*4/3+4));
 stage.style.setProperty('--stage-height',`${h}px`);
 stage.style.setProperty('--stage-width',`${Math.max(0,(h-4)*3/4+4)}px`);
}
function fitViewport(){
 // Do not resize the game in response to accessibility pinch zoom.
 if(window.visualViewport && window.visualViewport.scale!==1)return;
 document.documentElement.style.setProperty('--viewport-height',`${window.visualViewport?.height||window.innerHeight}px`);
 fitStage();
}
new ResizeObserver(fitStage).observe(arena);
window.addEventListener('resize',fitViewport);
window.visualViewport?.addEventListener('resize',fitViewport);
fitViewport();

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),title=document.getElementById('resultTitle'),description=document.getElementById('resultText'),timeLabel=document.getElementById('time'),hitLabel=document.getElementById('hits');
const W=360,H=480,DURATION=60,player={x:160,y:423,w:40,h:40};
let running=false,remaining=DURATION,hits=0,blocks=[],keys={left:false,right:false},last=0,spawn=0,invincible=0,raf=0;
function reset(){remaining=DURATION;hits=0;blocks=[];spawn=0;invincible=0;player.x=160;last=0;timeLabel.textContent='剩餘 60 秒';hitLabel.textContent='碰撞 0 / 3';}
function finish(win){running=false;keys.left=keys.right=false;cancelAnimationFrame(raf);title.textContent=win?'🎉 過關成功！':'🥬 韭菜被套牢！';description.textContent=win?'成功沒買，沒買就沒賠！':'被股票砸中3次，再挑戰一次！';start.textContent='再玩一次';overlay.hidden=false;draw();}
function play(){cancelAnimationFrame(raf);reset();running=true;overlay.hidden=true;raf=requestAnimationFrame(loop);}
function spawnBlock(){const size=28+Math.random()*18;blocks.push({x:Math.random()*(W-size),y:-size,w:size,h:size,speed:125+Math.random()*100});}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function update(dt){remaining=Math.max(0,remaining-dt);timeLabel.textContent=`剩餘 ${Math.ceil(remaining)} 秒`;if(remaining<=0){finish(true);return;}
const move=(Number(keys.right)-Number(keys.left))*235*dt;player.x=Math.max(0,Math.min(W-player.w,player.x+move));spawn+=dt;while(spawn>=0.52){spawn-=0.52;spawnBlock();}
invincible=Math.max(0,invincible-dt);for(const b of blocks){b.y+=b.speed*dt;if(invincible===0&&collide(player,b)){hits++;invincible=1.1;hitLabel.textContent=`碰撞 ${hits} / 3`;b.y=H+100;if(hits>=3){finish(false);return;}}}blocks=blocks.filter(b=>b.y<H+10);}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff10';for(let i=0;i<12;i++){ctx.fillRect(i*36,0,1,H)}for(const b of blocks){ctx.fillStyle='#f05252';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('↓',b.x+b.w/2,b.y+b.h/2+7)}if(invincible===0||Math.floor(invincible*10)%2===0){ctx.fillStyle='#55b8ff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#10203c';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('☺',player.x+20,player.y+28);}}
function loop(t){if(!running)return;const dt=last?Math.min((t-last)/1000,0.05):0;last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop);}
function bind(id,direction){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[direction]=true;el.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,()=>keys[direction]=false);}
bind('left','left');bind('right','right');
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();keys[e.key==='ArrowLeft'?'left':'right']=true;}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys[e.key==='ArrowLeft'?'left':'right']=false;});window.addEventListener('blur',()=>{keys.left=keys.right=false;});start.addEventListener('click',play);draw();
})();
</script>
</body></html>
